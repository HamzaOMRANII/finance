# finance.omranisystems.com  ->  FinTrack on 127.0.0.1:17000
# Install: cp deploy/nginx.conf /etc/nginx/conf.d/finance.conf && nginx -t && systemctl reload nginx
# Included inside http{} via `include /etc/nginx/conf.d/*.conf;`, so it inherits the wildcard
# Cloudflare origin certificate (*.omranisystems.com) and the $connection_upgrade map.
#
# Two locks: the omranisystems access-code gate (app id "finance") in front of everything,
# then FinTrack's own login. The login endpoint is rate-limited here as well as in the app.

limit_req_zone $binary_remote_addr zone=finance_login:1m rate=5r/m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name finance.omranisystems.com;

    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /__gate {
        internal;
        proxy_pass http://127.0.0.1:4000/gate/verify?app=finance;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location @unlock {
        return 302 https://omranisystems.com/unlock?app=finance;
    }

    # uptime checks, no gate
    location = /healthz {
        proxy_pass http://127.0.0.1:17000;
    }

    location = /api/login {
        auth_request /__gate;
        error_page 401 = @unlock;
        limit_req zone=finance_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:17000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        auth_request /__gate;
        error_page 401 = @unlock;
        proxy_pass http://127.0.0.1:17000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
